<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AS WRITTEN — 아틀란티스를 끌어올리다</title>
<style>
  html,body{margin:0;background:#020a0d;color:#f3e9d6;font-family:"Noto Serif KR","Apple SD Gothic Neo",serif}
  body{height:620vh}
  #stage{position:fixed;inset:0;overflow:hidden}
  #cv,#ruin,#city{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
  #ruin,#city{pointer-events:none;transition:opacity .5s}
  #city{opacity:0}
  .vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 50%,rgba(0,0,0,.6) 100%)}
  #deep{position:fixed;inset:0;pointer-events:none;background:linear-gradient(to bottom,rgba(0,20,28,.15),rgba(0,10,16,.55))}
  .txt{position:fixed;left:50%;transform:translateX(-50%);width:min(760px,86vw);text-align:center;pointer-events:none;text-shadow:0 2px 14px rgba(0,0,0,.9);transition:opacity .6s}
  #t1{top:16vh}
  #t1 small{display:block;font-size:11px;letter-spacing:.42em;opacity:.7;margin-bottom:16px}
  #t1 p{margin:0;font-size:clamp(16px,2vw,21px);line-height:1.9;letter-spacing:.03em}
  #t1 em{display:block;margin-top:12px;font-style:normal;font-size:12px;letter-spacing:.18em;opacity:.6}
  #hint{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);text-align:center;font-size:12px;letter-spacing:.32em;opacity:.85;transition:opacity .6s;pointer-events:none}
  #hint i{display:block;margin:12px auto 0;width:1px;height:42px;background:linear-gradient(#f3e9d6,transparent);animation:drip 1.8s ease-in-out infinite}
  @keyframes drip{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
  #t2{top:13vh}
  #t2 small{display:block;font-size:11px;letter-spacing:.42em;opacity:.75;margin-bottom:12px}
  #t2 b{display:block;font-size:clamp(38px,6vw,64px);font-weight:400;letter-spacing:.32em;color:#f1cf8a}
  #t2 p{margin:14px 0 0;font-size:14px;letter-spacing:.08em;opacity:.85}
  #enter{position:fixed;left:50%;bottom:38px;transform:translateX(-50%);background:rgba(10,8,6,.55);color:#f3e9d6;border:1px solid rgba(241,207,138,.75);border-radius:26px;padding:12px 30px;font-family:inherit;font-size:14px;letter-spacing:.24em;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .8s}
  #enter.on{opacity:1;pointer-events:auto}
  #bar{position:fixed;right:22px;top:50%;transform:translateY(-50%);width:2px;height:34vh;background:rgba(243,233,214,.18)}
  #bar i{position:absolute;left:0;bottom:0;width:100%;background:#f1cf8a;height:0}
  #bar span{position:absolute;right:10px;font-size:10px;letter-spacing:.2em;white-space:nowrap;opacity:.6}
  #load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#020a0d;font-size:12px;letter-spacing:.32em;z-index:9;transition:opacity .8s}
</style>
</head>
<body>
<div id="stage"><canvas id="cv"></canvas><img id="ruin" src="ruin.jpg" alt=""><img id="city" src="city.jpg" alt=""></div>
<div id="deep"></div><div id="topfade" style="position:fixed;inset:0;pointer-events:none;opacity:0;background:linear-gradient(to bottom,rgba(0,0,0,.62) 0,rgba(0,0,0,.25) 34%,rgba(0,0,0,0) 52%)"></div><div class="vig"></div>
<div class="txt" id="t1"><small>AS WRITTEN · ATLANTIS</small>
  <p>격렬한 지진과 홍수가 일어났고,<br>하루 낮과 하루 밤 사이에<br>아틀란티스 섬은 바다 깊이 가라앉아 사라졌다.</p>
  <em>플라톤, 『티마이오스』 25c–d</em></div>
<div id="hint">스크롤해서 끌어올리기<i></i></div>
<div class="txt" id="t2" style="opacity:0"><small>쓰인 만큼만 되살린 도시</small><b>ATLANTIS</b><p>플라톤 『크리티아스』 113c–121c</p></div>
<button id="enter">도시로 들어가기</button>
<div id="bar"><i></i><span style="top:-18px">수면</span><span style="bottom:-18px">해저</span></div>
<div id="load">바다 밑으로 내려가는 중 <span id="pct">0</span>%</div>
<script>
const N=122, FW=832, FH=464, AR=1456/816;
const cv=document.getElementById('cv'), ctx=cv.getContext('2d'), ruin=document.getElementById('ruin'), city=document.getElementById('city');
const sheets=[]; let loaded=0; const NS=Math.ceil(N/4);
for(let k=1;k<=NS;k++){ const im=new Image(); im.onload=im.onerror=()=>{ loaded++; document.getElementById('pct').textContent=Math.round(loaded/NS*100);
  if(loaded===NS){ const l=document.getElementById('load'); l.style.opacity=0; setTimeout(()=>l.remove(),900); } }; im.src='t/'+String(k).padStart(2,'0')+'.jpg'; sheets.push(im); }
let W=0,H=0,drawn=-1;
function layout(){ const vw=innerWidth,vh=innerHeight; if(vw/vh>AR){W=vw*1.04;H=W/AR;}else{H=vh*1.04;W=H*AR;}
  const cw=Math.min(Math.round(W*Math.min(devicePixelRatio||1,2)),1280); cv.width=cw; cv.height=Math.round(cw*H/W);
  for(const el of [cv,ruin,city]){ el.style.width=W+'px'; el.style.height=H+'px'; } drawn=-1; }
addEventListener('resize',layout); layout();
function draw(i){ if(i===drawn) return; const sh=sheets[Math.floor(i/4)], q=i%4; if(!(sh.complete&&sh.naturalWidth)) return;
  ctx.drawImage(sh,(q%2)*FW,Math.floor(q/2)*FH,FW,FH,0,0,cv.width,cv.height); drawn=i; }

// ===== 소리: 물속의 먹먹함 → 수면 위 바람과 물결 =====
let AC=null,A={};
function initAudio(){ if(AC){ if(AC.state==='suspended') AC.resume(); return; }
  try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
  const n=AC.sampleRate*3, mk=kind=>{ const b=AC.createBuffer(1,n,AC.sampleRate), d=b.getChannelData(0); let l=0; for(let i=0;i<n;i++){ const w=Math.random()*2-1; if(kind){ l=(l+.02*w)/1.02; d[i]=l*3.5; } else d[i]=w; } return b; };
  const loop=b=>{ const s=AC.createBufferSource(); s.buffer=b; s.loop=true; s.start(); return s; };
  A.out=AC.createGain(); A.out.gain.value=.9; A.out.connect(AC.destination);
  A.lp=AC.createBiquadFilter(); A.lp.type='lowpass'; A.lp.frequency.value=180; A.sea=AC.createGain(); A.sea.gain.value=0;
  loop(mk(1)).connect(A.lp); A.lp.connect(A.sea); A.sea.connect(A.out);
  A.bp=AC.createBiquadFilter(); A.bp.type='bandpass'; A.bp.frequency.value=600; A.bp.Q.value=.7; A.air=AC.createGain(); A.air.gain.value=0;
  loop(mk(0)).connect(A.bp); A.bp.connect(A.air); A.air.connect(A.out);
  A.rum=AC.createGain(); A.rum.gain.value=0; const rl=AC.createBiquadFilter(); rl.type='lowpass'; rl.frequency.value=70; loop(mk(1)).connect(rl); rl.connect(A.rum); A.rum.connect(A.out);
}
['pointerdown','keydown','touchstart','wheel'].forEach(e=>addEventListener(e,initAudio,{passive:true}));

let p=0, tp=0, last=0;
function tick(t){
  const dt=Math.min(.05,(t-last)/1000||0); last=t;
  const max=document.documentElement.scrollHeight-innerHeight; tp=max>0?scrollY/max:0;
  const prev=p; p+=(tp-p)*Math.min(1,dt*5);
  const i=Math.max(0,Math.min(N-1,Math.round(p*(N-1)))); draw(i);
  ruin.style.opacity = p<.012 ? 1 : 0;
  city.style.opacity = p>.985 ? 1 : 0;
  document.getElementById('deep').style.opacity = Math.max(0,1-p*1.6);
  document.getElementById('t1').style.opacity = Math.max(0,1-p*4.5);
  document.getElementById('hint').style.opacity = p<.04?1:0;
  const t2o=Math.max(0,Math.min(1,(p-.9)*10)); document.getElementById('t2').style.opacity=t2o; document.getElementById('topfade').style.opacity=t2o;
  document.getElementById('enter').classList.toggle('on',p>.97);
  document.querySelector('#bar i').style.height=(p*100)+'%';
  if(AC&&AC.state==='running'){ const v=Math.abs(p-prev)/Math.max(dt,.001), ct=AC.currentTime;
    A.sea.gain.setTargetAtTime(.55*(1-p)+.25*p,ct,.2); A.lp.frequency.setTargetAtTime(180+p*1400,ct,.2);
    A.air.gain.setTargetAtTime(.10*Math.max(0,p-.45)*1.8,ct,.3);
    A.rum.gain.setTargetAtTime(Math.min(1.2,v*1.6),ct,.15); }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
document.getElementById('enter').addEventListener('click',()=>{ location.href='https://ejdms499-wq.github.io/as-written-atlantis/'; });
</script>
</body>
</html>
