<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>桃花源 — 바깥에 말하지 않을 이야기 · AS WRITTEN</title>
<meta name="description" content="도연명 「도화원기」 — 바깥사람들에게는 말할 것이 못 되는 이야기를 무릉도원에 묶어 두고 나오세요. 하루가 지나면 길을 잃어 사라집니다.">
<meta property="og:title" content="桃花源 — 바깥에 말하지 않을 이야기">
<meta property="og:description" content="바깥에선 말 못 할 이야기를 붉은 천에 묶어 두고 나오세요. 내일이면 길을 잃습니다.">
<meta property="og:image" content="village_s.jpg">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600&family=Noto+Serif+TC:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0f0d0b;color:#f4ece0;font-family:'Noto Serif KR',serif;word-break:keep-all;overflow-wrap:break-word;-webkit-tap-highlight-color:transparent}
#scene{position:fixed;inset:-4%;background:#1a1612 url(village_s.jpg) center/cover;animation:drift 70s ease-in-out infinite alternate;will-change:transform}
#scene.hi{background-image:url(village.jpg)}
@keyframes drift{0%{transform:scale(1.02) translate(0,0)}100%{transform:scale(1.1) translate(-1.6%,-1%)}}
#shade{position:fixed;inset:0;pointer-events:none;background:
  linear-gradient(to bottom,rgba(12,10,8,.42) 0,rgba(12,10,8,0) 22%,rgba(12,10,8,0) 48%,rgba(12,10,8,.55) 74%,rgba(12,10,8,.86) 100%),
  radial-gradient(ellipse at 50% 40%,rgba(255,236,210,.08),rgba(0,0,0,0) 60%)}
#pet{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#cloths{position:fixed;inset:0}
.cloth{position:absolute;width:30px;height:70px;margin-left:-15px;cursor:pointer;transform-origin:50% 4px;animation:sway var(--d) ease-in-out infinite alternate;animation-delay:var(--dl)}
.cloth::before{content:'';position:absolute;left:11px;top:0;width:8px;height:8px;border-radius:50%;background:#7e1820;box-shadow:0 1px 2px rgba(0,0,0,.5)}
.cloth i{position:absolute;left:9px;top:5px;width:12px;height:54px;border-radius:2px 2px 5px 7px;background:linear-gradient(90deg,#8e1a22 0,#bb2c33 40%,#a5232b 70%,#7a141b 100%);box-shadow:0 2px 6px rgba(0,0,0,.35);transform:skewX(-3deg)}
.cloth i::after{content:'';position:absolute;left:3px;bottom:-9px;width:8px;height:14px;border-radius:0 0 5px 5px;background:inherit;transform:rotate(12deg)}
.cloth.mine i{background:linear-gradient(90deg,#9c1d25 0,#d6403f 40%,#bb2c33 70%,#86161e 100%);box-shadow:0 0 14px rgba(255,170,150,.55),0 2px 6px rgba(0,0,0,.35)}
.cloth.new{animation:tie 1.6s cubic-bezier(.2,.8,.2,1) both, sway var(--d) ease-in-out 1.6s infinite alternate}
.cloth.lost{transition:opacity 4s,filter 4s;opacity:0;filter:blur(6px)}
.cloth:hover i,.cloth.open i{filter:brightness(1.25)}
@keyframes sway{0%{transform:rotate(-5deg)}100%{transform:rotate(5deg)}}
@keyframes tie{0%{transform:translateY(-60px) scale(.6) rotate(-20deg);opacity:0}60%{opacity:1}100%{transform:translateY(0) scale(1) rotate(0)}}
#brand{position:fixed;left:26px;top:22px;font-size:13px;letter-spacing:.28em;opacity:.8;pointer-events:none}
#brand b{font-family:'Noto Serif TC',serif;font-weight:400;color:#f2b3bf;letter-spacing:.2em}
#snd{position:fixed;right:22px;top:18px;padding:8px 16px;font-size:14px;border-radius:999px;border:1px solid rgba(244,236,224,.25);background:rgba(16,14,11,.45);color:#f4ece0;cursor:pointer;font-family:inherit;backdrop-filter:blur(6px)}
#words{position:fixed;left:50%;bottom:max(34px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(820px,92vw);text-align:center;pointer-events:none}
#han{font-family:'Noto Serif TC',serif;font-size:clamp(20px,2.4vw,28px);letter-spacing:.14em;line-height:1.6;color:#fff6ea;text-shadow:0 2px 18px rgba(0,0,0,.6)}
#kor{margin-top:8px;font-size:clamp(17px,1.8vw,21px);font-weight:300;line-height:1.7;opacity:.92;text-shadow:0 2px 14px rgba(0,0,0,.7)}
#count{margin-top:18px;font-size:15px;line-height:1.8;opacity:.78}
#count .lost{display:block;opacity:.75;font-size:14px}
#leave{pointer-events:auto;margin-top:18px;padding:14px 34px;font-size:18px;font-family:inherit;color:#fff;border-radius:999px;border:1px solid rgba(242,179,191,.55);background:rgba(140,30,40,.45);backdrop-filter:blur(6px);cursor:pointer;transition:background .3s}
#leave:hover{background:rgba(170,40,50,.6)}
#leave[disabled]{opacity:.65;cursor:default;background:rgba(40,30,26,.5);border-color:rgba(244,236,224,.25)}
#card{position:fixed;z-index:6;max-width:300px;padding:18px 20px 14px;border-radius:14px;background:rgba(24,19,15,.86);border:1px solid rgba(242,179,191,.25);backdrop-filter:blur(8px);font-size:17px;line-height:1.75;opacity:0;transform:translateY(6px);transition:opacity .5s,transform .5s;pointer-events:none}
#card.on{opacity:1;transform:none;pointer-events:auto}
#card small{display:block;margin-top:10px;font-size:12px;opacity:.55;letter-spacing:.05em}
#form{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:rgba(10,8,7,.55);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .5s}
#form.on{opacity:1;pointer-events:auto}
#form .box{width:min(520px,90vw);padding:30px 28px 24px;border-radius:18px;background:rgba(26,21,17,.94);border:1px solid rgba(242,179,191,.25);text-align:center}
#form p{font-size:16px;line-height:1.8;opacity:.85}
#form textarea{width:100%;margin-top:18px;height:110px;resize:none;padding:14px 16px;border-radius:12px;border:1px solid rgba(244,236,224,.2);background:rgba(255,255,255,.05);color:#fff;font-family:inherit;font-size:18px;line-height:1.6;outline:none}
#form textarea:focus{border-color:rgba(242,179,191,.6)}
#form .row{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:13px;opacity:.7}
#form .err{color:#ffb2a8;opacity:1;min-height:20px}
#form .btns{display:flex;gap:10px;justify-content:center;margin-top:16px}
#form button{padding:12px 26px;font-size:17px;font-family:inherit;border-radius:999px;cursor:pointer;color:#fff}
#tie{border:1px solid rgba(242,179,191,.6);background:rgba(160,36,46,.6)}
#cancel{border:1px solid rgba(244,236,224,.25);background:transparent}
#toast{position:fixed;left:50%;top:24%;transform:translateX(-50%);padding:14px 26px;border-radius:999px;background:rgba(18,15,12,.7);backdrop-filter:blur(6px);font-size:17px;opacity:0;transition:opacity .9s;pointer-events:none;text-align:center;z-index:8}
#toast.on{opacity:1}
#veil{position:fixed;inset:0;background:#0f0d0b;z-index:20;transition:opacity 2.2s;pointer-events:none}
#veil.off{opacity:0}
#note{position:fixed;left:26px;bottom:14px;font-size:12px;opacity:.45;pointer-events:none}
@media (max-width:640px){
  #brand{left:18px;top:18px;font-size:11px}
  #words{bottom:max(22px,env(safe-area-inset-bottom))}
  #count{font-size:14px;margin-top:12px}
  #leave{font-size:17px;padding:13px 26px}
  .cloth{transform-origin:50% 4px;scale:.85}
  #note{display:none}
}
</style>
</head>
<body>
<div id="scene"></div>
<canvas id="pet"></canvas>
<div id="shade"></div>
<div id="cloths"></div>
<div id="brand">AS WRITTEN · <b>桃花源</b></div>
<button id="snd">소리 켜기</button>
<div id="words">
  <div id="han">此中人語云：「不足爲外人道也。」</div>
  <div id="kor">그곳 사람들이 말했다. "바깥사람들에게 말할 것은 못 됩니다."</div>
  <div id="count"></div>
  <button id="leave">바깥에선 말 못 할 이야기, 여기 두고 가기</button>
</div>
<div id="card"></div>
<div id="form"><div class="box">
  <p>바깥사람들에게는 말할 수 없는 이야기를 한 줄 적어 붉은 천에 묶어 두세요.<br>누가 썼는지는 아무도 몰라요. 내일이면 길을 잃어 사라져요.</p>
  <textarea id="txt" maxlength="80" placeholder="여기에만 두고 갈 말"></textarea>
  <div class="row"><span class="err" id="err"></span><span id="len">0 / 80</span></div>
  <div class="btns"><button id="cancel">그만두기</button><button id="tie">묶어 두기</button></div>
</div></div>
<div id="toast"></div>
<div id="note">陶淵明 「桃花源記」</div>
<div id="veil"></div>
<script>
// ───── 저장소 (Supabase) — 두 값을 넣으면 모두의 천이 보여요. 비어 있으면 이 기기에서만. ─────
const SUPA_URL = '';
const SUPA_KEY = '';
const TABLE = 'mureung_notes';
const ONLINE = !!(SUPA_URL && SUPA_KEY);

const $ = id => document.getElementById(id);
// 하루는 한국 시간 자정에 끝나요
function kstMidnight(off = 0) { const k = new Date(Date.now() + 9 * 3600e3); k.setUTCHours(0, 0, 0, 0); return new Date(k.getTime() - 9 * 3600e3 + off * 86400e3); }
const todayKey = () => kstMidnight(0).toISOString().slice(0, 10);

async function api(path, opt = {}) {
  const r = await fetch(SUPA_URL.replace(/\/$/, '') + '/rest/v1/' + path, { ...opt, headers: { apikey: SUPA_KEY, Authorization: 'Bearer ' + SUPA_KEY, 'Content-Type': 'application/json', ...(opt.headers || {}) } });
  if (!r.ok) throw new Error(r.status);
  return r;
}
const localAll = () => { try { return JSON.parse(localStorage.getItem('mureung_notes') || '[]'); } catch (e) { return []; } };
async function fetchNotes() {
  const t0 = kstMidnight(0).toISOString(), y0 = kstMidnight(-1).toISOString();
  if (!ONLINE) {
    const all = localAll();
    return { today: all.filter(n => n.created_at >= t0).reverse(), yest: all.filter(n => n.created_at >= y0 && n.created_at < t0).length };
  }
  const a = await api(`${TABLE}?select=id,text,created_at&created_at=gte.${t0}&order=created_at.desc&limit=300`);
  const today = await a.json();
  let yest = 0;
  try { const b = await api(`${TABLE}?select=id&created_at=gte.${y0}&created_at=lt.${t0}`, { headers: { Prefer: 'count=exact', Range: '0-0' } }); const cr = b.headers.get('content-range') || ''; yest = +(cr.split('/')[1] || 0); } catch (e) {}
  return { today, yest };
}
async function saveNote(text) {
  if (!ONLINE) { const all = localAll(); const n = { id: 'l' + Date.now(), text, created_at: new Date().toISOString() }; all.push(n); localStorage.setItem('mureung_notes', JSON.stringify(all.slice(-200))); return n.id; }
  const r = await api(TABLE + '?select=id', { method: 'POST', headers: { Prefer: 'return=representation' }, body: JSON.stringify({ text }) });
  const j = await r.json(); return j[0] && j[0].id;
}

// ───── 붉은 천 ─────
const shown = new Map();
let mineId = localStorage.getItem('mureung_mine_' + todayKey());
function hash(s) { let h = 2166136261; for (const c of String(s)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return (h >>> 0) / 4294967296; }
function spot(id) {
  // 그림 위 아무 데나가 아니라 위쪽 2/3 안에서, 다른 천과 너무 붙지 않게
  let best = null, bd = -1;
  for (let k = 0; k < 10; k++) {
    const a = hash(id + ':' + k), b = hash(k + ':' + id);
    const x = 5 + a * 90, y = 12 + b * (innerWidth < 640 ? 36 : 30);
    let md = 1e9; for (const [, c] of shown) md = Math.min(md, Math.hypot(c.x - x, (c.y - y) * 1.6));
    if (md > bd) { bd = md; best = { x, y }; }
  }
  return best || { x: 50, y: 30 };
}
function addCloth(n, fresh) {
  if (shown.has(n.id)) return;
  const p = spot(n.id), el = document.createElement('div');
  el.className = 'cloth' + (String(n.id) === String(mineId) ? ' mine' : '') + (fresh ? ' new' : '');
  el.style.left = p.x + '%'; el.style.top = p.y + '%';
  el.style.setProperty('--d', (3.2 + hash(n.id + 'd') * 3).toFixed(2) + 's');
  el.style.setProperty('--dl', (-hash(n.id + 'l') * 5).toFixed(2) + 's');
  el.innerHTML = '<i></i>';
  el.addEventListener('click', e => { e.stopPropagation(); openCard(n, el); });
  $('cloths').appendChild(el);
  shown.set(n.id, { x: p.x, y: p.y, el, n });
}
function ago(iso) {
  const d = new Date(new Date(iso).getTime() + 9 * 3600e3), h = d.getUTCHours();
  const part = h < 5 ? '새벽' : h < 12 ? '아침' : h < 17 ? '낮' : h < 21 ? '저녁' : '밤';
  return `오늘 ${part} ${((h + 11) % 12) + 1}시쯤`;
}
let openEl = null;
function openCard(n, el) {
  if (openEl) openEl.classList.remove('open');
  openEl = el; el.classList.add('open');
  const c = $('card'); c.textContent = n.text;
  const s = document.createElement('small'); s.textContent = ago(n.created_at) + (String(n.id) === String(mineId) ? ' · 내가 묶은 천' : ''); c.appendChild(s);
  const r = el.getBoundingClientRect(), W = Math.min(300, innerWidth - 24);
  let x = r.left + r.width / 2 - W / 2; x = Math.max(12, Math.min(innerWidth - W - 12, x));
  c.style.width = W + 'px'; c.style.left = x + 'px';
  const ch = c.offsetHeight || 110, wordsTop = $('words').getBoundingClientRect().top;
  let y = r.bottom + 10; if (y + ch > wordsTop - 10) y = Math.max(12, r.top - ch - 10);
  c.style.top = y + 'px';
  c.classList.add('on'); pluck(hz(62), .05);
}
addEventListener('click', () => { $('card').classList.remove('on'); if (openEl) openEl.classList.remove('open'); openEl = null; });

let count = 0, yest = 0;
function renderCount() {
  const c = $('count');
  c.innerHTML = '';
  const a = document.createElement('span'); a.textContent = count ? `오늘 이 마을에 묶인 말 ${count}개` : '오늘은 아직 아무도 말을 두고 가지 않았어요';
  c.appendChild(a);
  if (yest) { const b = document.createElement('span'); b.className = 'lost'; b.textContent = `어제 묶인 말 ${yest}개는 모두 길을 잃었어요 · 遂迷，不復得路。`; c.appendChild(b); }
  if (!ONLINE) { const b = document.createElement('span'); b.className = 'lost'; b.textContent = '(아직 저장소를 잇기 전이라, 이 기기에서 묶은 천만 보여요)'; c.appendChild(b); }
  const left = localStorage.getItem('mureung_left') === todayKey();
  $('leave').disabled = left;
  $('leave').textContent = left ? '오늘은 이미 한 줄 두고 갔어요' : '바깥에선 말 못 할 이야기, 여기 두고 가기';
}
async function refresh(first) {
  try {
    const r = await fetchNotes();
    yest = r.yest; count = r.today.length;
    const ids = new Set(r.today.map(n => String(n.id)));
    for (const [id, c] of shown) if (!ids.has(String(id))) { c.el.classList.add('lost'); setTimeout(() => c.el.remove(), 4200); shown.delete(id); }
    r.today.slice(0, innerWidth < 640 ? 40 : 90).reverse().forEach(n => addCloth(n, !first));
    renderCount();
  } catch (e) { $('count').textContent = '마을로 가는 길이 잠시 흐려요. 조금 뒤에 다시 와 주세요.'; }
}

// ───── 두고 가기 ─────
const BAD = [/https?:|www\.|\.com|\.kr|\.net/i, /\d{2,4}[-\s.]?\d{3,4}[-\s.]?\d{4}/, /@[a-z0-9_]{3,}|[a-z0-9._-]+@[a-z0-9.-]+/i, /카톡|오픈채팅|텔레그램|디엠|dm/i];
$('leave').addEventListener('click', e => { e.stopPropagation(); initAudio(); $('form').classList.add('on'); setTimeout(() => $('txt').focus(), 300); });
$('cancel').addEventListener('click', () => { $('form').classList.remove('on'); });
$('txt').addEventListener('input', () => { $('len').textContent = $('txt').value.length + ' / 80'; $('err').textContent = ''; });
$('tie').addEventListener('click', async () => {
  const t = $('txt').value.replace(/\s+/g, ' ').trim();
  if (!t) { $('err').textContent = '한 줄은 적어야 묶을 수 있어요'; return; }
  if (BAD.some(r => r.test(t))) { $('err').textContent = '주소나 연락처는 묶을 수 없어요'; return; }
  $('tie').disabled = true;
  try {
    const id = await saveNote(t.slice(0, 80));
    mineId = id; localStorage.setItem('mureung_mine_' + todayKey(), id); localStorage.setItem('mureung_left', todayKey());
    $('form').classList.remove('on'); $('txt').value = ''; $('len').textContent = '0 / 80';
    addCloth({ id, text: t, created_at: new Date().toISOString() }, true); count++; renderCount();
    [57, 62, 66].forEach((m, i) => setTimeout(() => pluck(hz(m), .05), i * 220));
    toast('묶어 두었어요. 내일이면 길을 잃어요.');
  } catch (e) { $('err').textContent = '천을 묶지 못했어요. 잠시 뒤 다시 해 주세요.'; }
  $('tie').disabled = false;
});
function toast(s) { const t = $('toast'); t.textContent = s; t.classList.add('on'); setTimeout(() => t.classList.remove('on'), 3800); }

// ───── 흩날리는 복숭아꽃잎 (落英繽紛) ─────
const pc = $('pet'), px = pc.getContext('2d'); let PW = 0, PH = 0;
function fit() { const d = Math.min(devicePixelRatio || 1, 1.5); PW = pc.width = Math.round(innerWidth * d); PH = pc.height = Math.round(innerHeight * d); }
fit(); addEventListener('resize', fit);
const P = Array.from({ length: innerWidth < 700 ? 34 : 60 }, () => spawn({}, true));
function spawn(p, any) { p.x = any ? Math.random() : -.05 - Math.random() * .2; p.y = any ? Math.random() : Math.random() * .7 - .2; p.z = .5 + Math.random() * 1.2; p.r = Math.random() * 6.28; p.sp = (Math.random() - .5) * 3; p.fl = Math.random() * 6.28; p.fs = 1.5 + Math.random() * 2.5; p.c = Math.random(); return p; }
let last = performance.now();
function petals(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  px.clearRect(0, 0, PW, PH);
  const t = now / 1000, gust = .5 + .5 * Math.sin(t * .23) * Math.sin(t * .11);
  for (const p of P) {
    p.x += (.018 + gust * .03) * dt / p.z * 1.6; p.y += (.022 + .01 * p.c) * dt / p.z * 1.4; p.r += p.sp * dt; p.fl += p.fs * dt;
    if (p.x > 1.05 || p.y > 1.05) { spawn(p, false); continue; }
    const r = PW * .0085 / p.z;
    px.save(); px.translate(p.x * PW, p.y * PH); px.rotate(p.r); px.scale(Math.max(.2, Math.abs(Math.cos(p.fl))), 1);
    px.globalAlpha = .85 * Math.min(1, 1.6 - p.z * .6);
    px.fillStyle = p.c < .5 ? '#f4b3c4' : p.c < .8 ? '#ee9db3' : '#f9cdd8';
    px.beginPath(); px.moveTo(0, -r); px.bezierCurveTo(r * .95, -r * .75, r * .8, r * .7, 0, r); px.bezierCurveTo(-r * .8, r * .7, -r * .95, -r * .75, 0, -r); px.fill();
    px.restore();
  }
  requestAnimationFrame(petals);
}
requestAnimationFrame(petals);

// ───── 소리: 낮고 조용한 바탕음 (리미터, 잡음 없음) ─────
let AC = null, A = {}, sound = false;
const hz = m => 440 * Math.pow(2, (m - 69) / 12);
function initAudio() {
  if (AC) { AC.resume(); return; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  const lim = AC.createDynamicsCompressor(); lim.threshold.value = -20; lim.ratio.value = 20; lim.attack.value = .003; lim.release.value = .25;
  A.out = AC.createGain(); A.out.gain.value = 0; A.out.connect(lim); lim.connect(AC.destination);
  A.lp = AC.createBiquadFilter(); A.lp.type = 'lowpass'; A.lp.frequency.value = 650; A.lp.connect(A.out);
  A.pad = [50, 57, 62].map(m => { const o = AC.createOscillator(); o.type = 'sine'; o.frequency.value = hz(m - 12); const g = AC.createGain(); g.gain.value = .03; o.connect(g); g.connect(A.lp); o.start(); return o; });
  const MEL = [62, null, 69, null, 67, null, 65, null, null, 62, null, null, 60, null, 62, null, null, null];
  let i = 0; setInterval(() => { const m = MEL[i++ % MEL.length]; if (m && sound) pluck(hz(m), .045); }, 1900);
  const PADS = [[50, 57, 62], [48, 55, 60], [53, 60, 65], [50, 57, 65]]; let ci = 0;
  setInterval(() => { ci = (ci + 1) % 4; PADS[ci].forEach((m, k) => A.pad[k].frequency.setTargetAtTime(hz(m - 12), AC.currentTime, 2.5)); }, 11000);
}
function pluck(f, amp) {
  if (!AC || !sound) return; const t = AC.currentTime, g = AC.createGain(), o = AC.createOscillator();
  o.type = 'triangle'; o.frequency.value = f; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(amp, t + .02); g.gain.exponentialRampToValueAtTime(.0003, t + 4);
  o.connect(g); g.connect(A.lp); o.start(t); o.stop(t + 4.1);
}
$('snd').addEventListener('click', e => { e.stopPropagation(); initAudio(); sound = !sound; A.out && A.out.gain.setTargetAtTime(sound ? .35 : 0, AC.currentTime, .4); $('snd').textContent = sound ? '소리 끄기' : '소리 켜기'; });

{ const im = new Image(); im.onload = () => $('scene').classList.add('hi'); im.src = 'village.jpg'; }

refresh(true);
